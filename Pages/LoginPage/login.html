<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Spotless Carwash - Login</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/login.css">
</head>
<body>

    <div class="bg-container">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="light-streak streak-1"></div>
        <div class="light-streak streak-2"></div>
        <div class="water-drops"></div>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="card-header">
                <h1>SPOTLESS CARWASH</h1>
                <p>Sign in to continue to your account</p>
            </div>

            <!-- Custom Notification Target Box -->
            <div id="alertBox" class="alert-container hidden">
                <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span id="alertMessage"></span>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="plateInput" class="sr-only">License Plate</label>
                    <div class="input-container">
                        <!-- Pure Inline SVG Profile Icon -->
                        <svg class="input-icon left-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="plateInput" placeholder="License Plate" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="passInput" class="sr-only">Password</label>
                    <div class="input-container">
                        <!-- Pure Inline SVG Lock Icon -->
                        <svg class="input-icon left-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="passInput" placeholder="Password" required>
                        <button type="button" id="togglePassword" class="right-icon-btn" aria-label="Toggle password visibility">
                            <!-- Pure Inline SVG Eye Container -->
                            <svg id="eyeIcon" class="eye-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-utilities">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span class="custom-checkbox"></span>
                        <span class="label-text">Remember Me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" id="submitBtn" class="btn-primary">
                    <span class="btn-text">SIGN IN</span>
                    <div id="btnSpinner" class="spinner hidden"></div>
                </button>
            </form>
        </div>
    </div>

    <script src="/login.js"></script>
</body>
</html>
